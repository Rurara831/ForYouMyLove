<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最親愛的流特</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- 🔑 密碼彈窗 -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-card">
            <h2>🔒 專屬我們的秘密</h2>
            <p>請輸入寶寶最重要的日子：</p>
            <input type="password" id="passwordInput" placeholder="四位數密碼" maxlength="4">
            <button id="submitPassword">進入網站</button>
        </div>
    </div>

    <!-- 🌸 歡迎動畫畫面 -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-content">
            <h1>❤️ 流特寶寶 ❤️</h1>
            <p>歡迎來到專屬於我們的秘密基地...</p>
        </div>
    </div>

    <!-- 🏠 網站主要內容區塊 -->
    <div id="mainContent" class="main-container">
        <!-- 導覽頁籤 -->
        <div class="tab-nav">
            <button class="tab active" data-tab="letter">❤️ 告白信件</button>
            <button class="tab" data-tab="music">🎵 專屬歌單</button>
            <button class="tab" data-tab="tips">📝 貼心叮嚀</button>
            <button class="tab" data-tab="gallery">🌷 回憶相簿</button>
        </div>

        <!-- 💌 分頁 1：告白信件 -->
        <div class="tab-content active" id="letter">
            <div class="letter-box" id="loveLetter">
                <div class="letter-header">
                    <h3>給 最親愛的流特</h3>
                    <span class="click-hint">👇 點擊展開信件</span>
                </div>
                <div class="letter-body">
                    <p>這是寫給你的一封信...</p>
                    <p>謝謝你一直以來的陪伴與包容，陪我度過每一個平凡又特別的日子。</p>
                    <p>希望能和你一起創造更多美好的回憶，愛你唷！❤️</p>
                </div>
            </div>
        </div>

        <!-- 🎵 分頁 2：專屬歌單 -->
        <div class="tab-content" id="music">
            <h2>代表我們的歌曲</h2>
            <a href="https://www.youtube.com/results?search_query=でも、高瀬統也" target="_blank" class="song-link">
                <div class="song">
                    <div class="song-icon">🎵</div>
                    <div class="song-info">
                        <h4>でも、</h4>
                        <p>高瀬統也、れん</p>
                    </div>
                </div>
            </a>
            <a href="https://www.youtube.com/results?search_query=歲月神偷+張杰" target="_blank" class="song-link">
                <div class="song">
                    <div class="song-icon">🎵</div>
                    <div class="song-info">
                        <h4>歲月神偷</h4>
                        <p>張杰</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- 📝 分頁 3：貼心叮嚀 -->
        <div class="tab-content" id="tips">
            <h2>給寶寶的叮嚀小卡</h2>
            <ul class="tips-list">
                <li>天冷記得多穿衣服，不要感冒囉！</li>
                <li>每天都要記得多喝水，照顧好自己。</li>
                <li>累的時候隨時來找我，我一直在！</li>
            </ul>
        </div>

        <!-- 🌷 分頁 4：照片牆 -->
        <div class="tab-content" id="gallery">
            <h2>屬於我們的美好回憶</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="./images/01.jpg" alt="Memory 1"></div>
                <div class="gallery-item"><img src="./images/02.jpg" alt="Memory 2"></div>
                <div class="gallery-item"><img src="./images/03.jpg" alt="Memory 3"></div>
                <div class="gallery-item"><img src="./images/04.jpg" alt="Memory 4"></div>
                <div class="gallery-item"><img src="./images/05.jpg" alt="Memory 5"></div>
                <div class="gallery-item"><img src="./images/06.jpg" alt="Memory 6"></div>
                <div class="gallery-item"><img src="./images/07.jpg" alt="Memory 7"></div>
                <div class="gallery-item"><img src="./images/08.jpg" alt="Memory 8"></div>
            </div>
        </div>
    </div>

    <!-- 🎵 背景音樂（放在畫面右下角控制） -->
    <audio id="bgm" src="./bgm.mp3" loop preload="auto"></audio>
    <button id="musicToggle" class="music-btn">🎵 播放音樂</button>

    <script src="./script.js"></script>
</body>
</html>
